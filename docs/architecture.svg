<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="900"
     viewBox="0 0 1200 900"
     role="img"
     aria-labelledby="title description">
  <title id="title">Temperature Monitor Software Architecture</title>
  <desc id="description">
    Layered software architecture showing the PC demonstration, application
    controller, domain logic, hardware abstractions, PC mocks, and future
    bare-metal drivers.
  </desc>

  <defs>
    <marker id="arrow"
            markerWidth="10"
            markerHeight="10"
            refX="9"
            refY="3"
            orient="auto"
            markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>

    <style>
      .background {
        fill: #f8fafc;
      }

      .title {
        fill: #0f172a;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 30px;
        font-weight: bold;
        text-anchor: middle;
      }

      .subtitle {
        fill: #475569;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        text-anchor: middle;
      }

      .layer {
        stroke: #334155;
        stroke-width: 2;
        rx: 12;
        ry: 12;
      }

      .layer-label {
        fill: #0f172a;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 19px;
        font-weight: bold;
      }

      .box {
        fill: #ffffff;
        stroke: #475569;
        stroke-width: 1.5;
        rx: 8;
        ry: 8;
      }

      .box-title {
        fill: #0f172a;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 17px;
        font-weight: bold;
        text-anchor: middle;
      }

      .box-text {
        fill: #334155;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        text-anchor: middle;
      }

      .arrow {
        fill: none;
        stroke: #334155;
        stroke-width: 2;
        marker-end: url(#arrow);
      }

      .bidirectional {
        fill: none;
        stroke: #334155;
        stroke-width: 2;
        marker-start: url(#arrow);
        marker-end: url(#arrow);
      }

      .note {
        fill: #fff7ed;
        stroke: #f97316;
        stroke-width: 1.5;
        rx: 8;
        ry: 8;
      }

      .note-text {
        fill: #7c2d12;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <rect class="background" x="0" y="0" width="1200" height="900"/>

  <text class="title" x="600" y="42">
    Temperature Monitor Software Architecture
  </text>
  <text class="subtitle" x="600" y="70">
    Shared architecture for the C and C++ implementations
  </text>

  <!-- Demonstration layer -->
  <rect class="layer"
        x="40"
        y="95"
        width="1120"
        height="115"
        fill="#dbeafe"/>
  <text class="layer-label" x="58" y="122">
    Demonstration / Composition Layer
  </text>

  <rect class="box" x="125" y="138" width="280" height="52"/>
  <text class="box-title" x="265" y="160">PC Demonstration</text>
  <text class="box-text" x="265" y="180">Interactive setpoints and diagnostics</text>

  <rect class="box" x="460" y="138" width="280" height="52"/>
  <text class="box-title" x="600" y="160">Composition Root</text>
  <text class="box-text" x="600" y="180">Constructs and connects components</text>

  <rect class="box" x="795" y="138" width="280" height="52"/>
  <text class="box-title" x="935" y="160">Embedded Startup</text>
  <text class="box-text" x="935" y="180">Future target-specific composition</text>

  <!-- Application layer -->
  <rect class="layer"
        x="40"
        y="235"
        width="1120"
        height="130"
        fill="#dcfce7"/>
  <text class="layer-label" x="58" y="264">Application Layer</text>

  <rect class="box" x="135" y="282" width="300" height="60"/>
  <text class="box-title" x="285" y="306">Application Controller</text>
  <text class="box-text" x="285" y="328">
    Initialization, state and coordination
  </text>

  <rect class="box" x="465" y="282" width="270" height="60"/>
  <text class="box-title" x="600" y="306">Acquisition Coordinator</text>
  <text class="box-text" x="600" y="328">Sample readiness and overrun policy</text>

  <rect class="box" x="765" y="282" width="300" height="60"/>
  <text class="box-title" x="915" y="306">Error Policy</text>
  <text class="box-text" x="915" y="328">Status and fail-safe LED request</text>

  <!-- Domain layer -->
  <rect class="layer"
        x="40"
        y="390"
        width="1120"
        height="145"
        fill="#fef3c7"/>
  <text class="layer-label" x="58" y="419">Domain Layer</text>

  <rect class="box" x="90" y="443" width="235" height="68"/>
  <text class="box-title" x="207" y="466">Sensor Conversion</text>
  <text class="box-text" x="207" y="487">Rev-A: digit x 1.0 C</text>
  <text class="box-text" x="207" y="504">Rev-B: digit x 0.1 C</text>

  <rect class="box" x="355" y="443" width="235" height="68"/>
  <text class="box-title" x="472" y="466">Converted Temperature</text>
  <text class="box-text" x="472" y="489">Degrees Celsius</text>

  <rect class="box" x="620" y="443" width="235" height="68"/>
  <text class="box-title" x="737" y="466">Temperature Classifier</text>
  <text class="box-text" x="737" y="487">Normal / Warning / Critical</text>
  <text class="box-text" x="737" y="504">Boundary policy</text>

  <rect class="box" x="885" y="443" width="225" height="68"/>
  <text class="box-title" x="997" y="466">LED-State Mapping</text>
  <text class="box-text" x="997" y="487">Mutually exclusive outputs</text>
  <text class="box-text" x="997" y="504">Safe fault indication</text>

  <!-- HAL -->
  <rect class="layer"
        x="40"
        y="560"
        width="1120"
        height="130"
        fill="#ede9fe"/>
  <text class="layer-label" x="58" y="589">
    Hardware Abstraction Layer
  </text>

  <rect class="box" x="90" y="610" width="220" height="54"/>
  <text class="box-title" x="200" y="633">ADC Simulation</text>
  <text class="box-text" x="200" y="653">Temperature to sensor digit</text>

  <rect class="box" x="350" y="610" width="220" height="54"/>
  <text class="box-title" x="460" y="633">I2C / EEPROM</text>
  <text class="box-text" x="460" y="653">Revision and serial number</text>

  <rect class="box" x="610" y="610" width="220" height="54"/>
  <text class="box-title" x="720" y="633">GPIO Interface</text>
  <text class="box-text" x="720" y="653">Logical LED outputs</text>

  <rect class="box" x="870" y="610" width="220" height="54"/>
  <text class="box-title" x="980" y="633">Timer Interface</text>
  <text class="box-text" x="980" y="653">100 microsecond trigger</text>

  <!-- Implementations -->
  <rect class="layer"
        x="40"
        y="715"
        width="535"
        height="115"
        fill="#cffafe"/>
  <text class="layer-label" x="58" y="744">
    PC Hardware Implementations
  </text>
  <rect class="box" x="90" y="765" width="435" height="43"/>
  <text class="box-title" x="307" y="792">
    ADC, I2C/EEPROM, GPIO and Timer Mocks
  </text>

  <rect class="layer"
        x="625"
        y="715"
        width="535"
        height="115"
        fill="#e2e8f0"/>
  <text class="layer-label" x="643" y="744">
    Future Bare-Metal Implementations
  </text>
  <rect class="box" x="675" y="765" width="435" height="43"/>
  <text class="box-title" x="892" y="792">
    MCU Peripheral Drivers and ISR Bindings
  </text>

  <!-- Dependencies and data flow -->
  <path class="arrow" d="M600 190 L600 278"/>
  <path class="arrow" d="M285 342 L207 439"/>
  <path class="arrow" d="M325 477 L351 477"/>
  <path class="arrow" d="M590 477 L616 477"/>
  <path class="arrow" d="M855 477 L881 477"/>
  <path class="arrow" d="M600 342 L600 556"/>
  <path class="arrow" d="M915 342 L997 439"/>
  <path class="bidirectional" d="M307 711 L307 668"/>
  <path class="bidirectional" d="M892 711 L892 668"/>

  <rect class="note" x="350" y="845" width="500" height="36"/>
  <text class="note-text" x="600" y="868">
    PC execution validates behavior, not hard real-time jitter.
  </text>
</svg>
